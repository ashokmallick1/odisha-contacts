<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odisha Contacts Explorer - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            text-align: center;
            animation: fade-in 0.6s ease-out;
        }

        .login-hero {
            margin-bottom: 30px;
        }

        .login-logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: var(--primary-gradient);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            margin-bottom: 20px;
            box-shadow: var(--accent-glow);
            animation: logo-pulse 4s ease-in-out infinite;
        }

        .login-title {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .input-group input {
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: var(--font-sans);
            outline: none;
            transition: var(--transition-normal);
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            background: rgba(15, 23, 42, 0.4);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-container input {
            width: 100%;
            padding-right: 40px; /* Space for the icon */
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: var(--text-primary);
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
        }

        .btn-login {
            margin-top: 10px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: var(--primary-gradient);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .error-message {
            color: var(--danger-color);
            font-size: 0.85rem;
            margin-top: -8px;
            display: none;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="dark-theme">
    
    <div class="login-container glass-panel">
        <div class="login-hero">
            <div class="login-logo">
                <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4-4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
            </div>
            <h1 class="login-title">Welcome Back</h1>
            <p class="login-subtitle">Sign in to Odisha Contacts Explorer</p>
        </div>

        <form id="login-form" class="login-form">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter any username" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-container">
                    <input type="password" id="password" placeholder="Enter any password" required>
                    <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password">
                        <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label for="device_name">Device Name</label>
                <input type="text" id="device_name" placeholder="e.g. John's iPhone" required>
            </div>

            <div id="login-error" class="error-message">Invalid credentials</div>

            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>

    <script>
        // Check system preference to set initial theme matching the app
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (!prefersDark) {
            document.body.classList.remove('dark-theme');
            document.body.classList.add('light-theme');
        }

        // Pre-fill device name if it exists
        const savedDevice = localStorage.getItem('device_name');
        if (savedDevice) {
            document.getElementById('device_name').value = savedDevice;
        } else {
            // Auto-generate a default fallback name based on user agent (basic heuristic)
            const ua = navigator.userAgent.toLowerCase();
            let defName = 'Desktop';
            if (ua.includes('iphone')) defName = 'iPhone';
            else if (ua.includes('ipad')) defName = 'iPad';
            else if (ua.includes('android')) defName = 'Android Device';
            else if (ua.includes('mac')) defName = 'MacBook/iMac';
            else if (ua.includes('win')) defName = 'Windows PC';
            document.getElementById('device_name').value = defName;
        }

        // Toggle password visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');

        togglePassword.addEventListener('click', function (e) {
            // Toggle the type attribute
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Toggle the eye icon
            if (type === 'text') {
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
                this.setAttribute('aria-label', 'Hide password');
            } else {
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
                this.setAttribute('aria-label', 'Show password');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Save the device name for subsequent sessions
            const deviceName = document.getElementById('device_name').value.trim();
            if (deviceName) {
                localStorage.setItem('device_name', deviceName);
            }

            const btn = document.querySelector('.btn-login');
            const errorEl = document.getElementById('login-error');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            btn.textContent = 'Authenticating...';
            btn.style.opacity = '0.8';
            errorEl.style.display = 'none';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    window.location.href = 'app.html';
                } else {
                    errorEl.textContent = 'Invalid username or password';
                    errorEl.style.display = 'block';
                    btn.textContent = 'Sign In';
                    btn.style.opacity = '1';
                }
            } catch (err) {
                errorEl.textContent = 'Network error. Please try again.';
                errorEl.style.display = 'block';
                btn.textContent = 'Sign In';
                btn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
