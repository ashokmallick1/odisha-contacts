<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odisha Contacts Explorer - Sources</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .sources-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }
        .sources-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: var(--header-bg);
            padding: 16px 24px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
        }
        .sources-title {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sources-actions {
            display: flex;
            gap: 12px;
        }
        .sources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .source-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: var(--transition-normal);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .source-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary-color);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.15);
        }
        .source-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            word-break: break-all;
        }
        .source-path {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .source-count {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            align-self: flex-start;
            margin-top: 4px;
        }
        .search-bar {
            width: 100%;
            padding: 14px 20px 14px 45px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: var(--transition-normal);
            margin-bottom: 24px;
        }
        .search-bar:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .search-wrapper {
            position: relative;
        }
        .search-icon-pos {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }
    </style>
</head>
<body class="dark-theme">
    <div class="sources-container">
        <header class="sources-header glass-panel">
            <div class="sources-title">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="var(--primary-color)" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                Source Directories
            </div>
            <div class="sources-actions">
                <button class="btn btn-secondary" onclick="window.location.href='app.html'">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Back to App
                </button>
                <button class="btn btn-secondary" onclick="window.location.href='index.html'">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Logout
                </button>
            </div>
        </header>

        <div class="search-wrapper">
            <svg class="search-icon-pos" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="sources-search" class="search-bar" placeholder="Search for a source directory (e.g., indiamart)...">
        </div>

        <div id="sources-grid" class="sources-grid">
            <!-- Source cards will be injected here -->
        </div>
    </div>

    <script>
        // Check system preference to set initial theme matching the app
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (!prefersDark) {
            document.body.classList.remove('dark-theme');
            document.body.classList.add('light-theme');
        }

        let allSources = [];

        async function fetchSources() {
            try {
                const res = await fetch('/api/source-browser');
                if (res.ok) {
                    allSources = await res.json();
                    renderSources(allSources);
                }
            } catch(e) {
                console.error("Failed to fetch sources", e);
            }
        }

        function renderSources(sources) {
            const grid = document.getElementById('sources-grid');
            grid.innerHTML = '';
            
            sources.forEach(source => {
                const name = source.dir.split('/').pop() || source.dir.split('\\').pop() || source.dir;
                const card = document.createElement('div');
                card.className = 'source-card glass-panel';
                card.innerHTML = `
                    <div class="source-name">${name}</div>
                    <div class="source-path" title="${source.dir}">${source.dir}</div>
                    <div class="source-count">${source.count.toLocaleString()} Contacts</div>
                `;
                card.addEventListener('click', () => {
                    window.location.href = 'app.html?source=' + encodeURIComponent(source.dir);
                });
                grid.appendChild(card);
            });
        }

        document.getElementById('sources-search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            if (!query) {
                renderSources(allSources);
                return;
            }
            const filtered = allSources.filter(s => s.dir.toLowerCase().includes(query));
            renderSources(filtered);
        });

        // Initialize
        fetchSources();
    </script>
</body>
</html>
